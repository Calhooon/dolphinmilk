[workspace]
members = [
    ".",
    "bsv-x402-server",
    "bsv-x402-llm-bridge",
    "examples/x402-service",
]

[package]
name = "dolphin-milk"
version = "0.1.4"
edition = "2021"
description = "Autonomous AI agent with BSV micropayments — pays for its own LLM inference via x402, every action becomes an on-chain proof"
repository = "https://github.com/calhooon/dolphinmilk"
homepage = "https://github.com/calhooon/dolphinmilk"
license = "Apache-2.0"
readme = "README.md"
keywords = ["bsv", "ai-agent", "x402", "micropayments", "blockchain"]
categories = ["command-line-utilities"]

[lib]
name = "dolphin_milk"
path = "src/lib.rs"

[[bin]]
name = "dolphin-milk"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "7"
croner = "3"
dotenvy = "0.15"
ripemd = "0.1"
glob = "0.3"
lru = "0.12"
url = "2"
tantivy = "0.22"
serde_yaml = "0.9"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
rmcp = { version = "0.16", features = ["server", "client", "transport-io", "transport-child-process"] }
schemars = "1.0"
bsv = { package = "bsv-rs", version = "0.3.4", features = ["full", "http"] }
futures-util = "0.3"
async-trait = "0.1"
chromiumoxide = { version = "0.9", features = ["fetcher", "zip8", "native-tls"], optional = true }
aho-corasick = "1"
prometheus = "0.13"
regex = "1"
bsv-x402-server = { path = "bsv-x402-server" }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
bsv-wallet-toolbox-rs = { version = "0.3.38", optional = true }
bsv-wallet-cli = { version = "0.1.23", optional = true, default-features = false }

[features]
default = ["embedded-wallet", "embed-ui", "browser"]
embed-ui = ["rust-embed", "mime_guess"]
embedded-wallet = ["bsv-wallet-toolbox-rs", "bsv-wallet-cli"]
browser = ["chromiumoxide"]
external-wallet = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
mockito = "1"

