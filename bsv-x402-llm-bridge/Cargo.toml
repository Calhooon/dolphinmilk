[package]
name = "bsv-x402-llm-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "x402 LLM provider bridge — sell LLM inference (OpenAI, Claude) to other agents via BSV micropayments"

[dependencies]
bsv-x402-server = { path = "../bsv-x402-server" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
