[package]
name = "x402-service-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "Example x402 paid API service using bsv-x402-server"

[dependencies]
bsv-x402-server = { path = "../../bsv-x402-server" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
chrono = "0.4"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
